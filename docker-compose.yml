# Dev and test environment (Phase 0 "IaC for dev/test").
#   docker compose up -d keycloak          identity provider only (run Signet with `npm run dev`)
#   docker compose --profile full up -d    the whole stack in containers
#   docker compose --profile presidio up -d presidio   DET-PII (then SIGNET_PRESIDIO_URL=http://localhost:5002)
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8180"]
    volumes:
      - ./infra/keycloak/realm-signet.json:/opt/keycloak/data/import/realm-signet.json:ro

  # DET-PII: Microsoft Presidio analyzer (MIT) for names and addresses in free text. Pinned: the
  # "latest" image did not start its worker when checked (13 Nov 2026).
  presidio:
    profiles: ["presidio", "full"]
    image: mcr.microsoft.com/presidio-analyzer:2.2.358
    ports: ["127.0.0.1:5002:3000"]

  control:
    profiles: ["full"]
    build: { context: ., target: control }
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure the PostgreSQL connection in .env}
      SIGNET_OIDC_ISSUER: http://localhost:8180/realms/signet
      SIGNET_DATA_DIR: /data
    volumes: ["signet-data:/data"]
    network_mode: host

  gateway-a1:
    profiles: ["full"]
    build: { context: ., target: gateway }
    environment:
      SIGNET_DATA_DIR: /data
      SIGNET_GATEWAY_PORT: "8100"
      SIGNET_NODE_ID: gw-a1
    volumes: ["signet-data:/data"]
    network_mode: host

  gateway-a2:
    profiles: ["full"]
    build: { context: ., target: gateway }
    environment:
      SIGNET_DATA_DIR: /data
      SIGNET_GATEWAY_PORT: "8101"
      SIGNET_NODE_ID: gw-a2
    volumes: ["signet-data:/data"]
    network_mode: host

volumes:
  signet-data:
