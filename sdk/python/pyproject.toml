[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signet-sdk"
version = "0.1.0"
description = "Connect an AI agent to the Signet gateway: workload identity, token refresh, OpenAI-compatible client, MCP and HTTP tools"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
test = ["pytest>=8", "openai>=1.40"]

[project.scripts]
signet-doctor = "signet_sdk.doctor:main"

[tool.setuptools.packages.find]
include = ["signet_sdk*"]
